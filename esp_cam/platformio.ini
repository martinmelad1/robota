[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
board_build.partitions = huge_app.csv
lib_deps =
    alvarowolfx/ESP32QRCodeReader